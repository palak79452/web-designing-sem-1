<!DOCTYPE html>
<html>

<head>
    <title>Multimedia Elements</title>
</head>

<body>

    <h3>Image</h3>
    <img src="campus.jpg" alt="College campus" width="150" height="150">


    <h3>Video</h3>
    <video width="300" controls>
        <source src="video.mp4" type="video/mp4">
    </video>

    <h3>Audio</h3>
    <audio controls>
        <source src="sample-audio.mpeg" type="audio/mpeg">
    </audio>

    <h3>YouTube</h3>
    <iframe width="320" height="180" src="https://www.youtube.com/embed/i35AUg11hvo?si=jqMihXoRUynitdZ9" allowfullscreen>
    </iframe>

</body>

</html>
